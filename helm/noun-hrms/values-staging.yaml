global:
  environment: staging

backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    minReplicas: 2
    maxReplicas: 6

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    minReplicas: 1
    maxReplicas: 4

ingress:
  hosts:
    - host: hrms-staging.noun.edu.ng
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /socket.io
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
