apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: noun-hrms
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.database.url | default "postgresql://postgres:postgres@localhost:5432/noun_hrms" | b64enc | quote }}
  DATABASE_URL_REPLICA: {{ .Values.database.readReplicaUrl | default "postgresql://postgres:postgres@localhost:5432/noun_hrms" | b64enc | quote }}
  JWT_SECRET: {{ "CHANGE_ME_JWT_SECRET_NOUN_HRMS_SECURE" | b64enc | quote }}
  SESSION_SECRET: {{ "CHANGE_ME_SESSION_SECRET_NOUN_HRMS" | b64enc | quote }}
