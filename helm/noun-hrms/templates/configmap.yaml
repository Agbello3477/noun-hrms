apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: noun-hrms
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  PORT: "5055"
  CLIENT_URL: "https://{{ (index .Values.ingress.hosts 0).host }}"
  NEXT_PUBLIC_API_URL: "https://{{ (index .Values.ingress.hosts 0).host }}/api/v1"
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379"
