# /etc/coturn/turnserver.conf - Unified HRMS Coturn Configuration

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

realm=turn.yourdomain.com
server-name=turn.yourdomain.com

# Enable dynamic time-limited credentials using HMAC-SHA1
use-auth-secret
static-auth-secret=YOUR_COTURN_SHARED_SECRET_KEY_HERE

fingerprint
stale-nonce=600
no-loopback-peers
no-multicast-peers
mobility
no-cli
log-file=stdout
