apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noun-hrms-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - hrms.noun.edu.ng
      secretName: noun-hrms-prod-tls
  rules:
    - host: hrms.noun.edu.ng
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: noun-backend-service
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: noun-backend-service
                port:
                  number: 80
          - path: /api/collaboration/doc
            pathType: Prefix
            backend:
              service:
                name: noun-backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noun-frontend-service
                port:
                  number: 80
