apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noun-hrms-prod

bases:
  - ../../base

namePrefix: prod-

patchesStrategicMerge:
  - ingress-patch.yaml
  - hpa-patch.yaml

configMapGenerator:
  - name: noun-hrms-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - CLIENT_URL=https://hrms.noun.edu.ng
      - PORT=5055
