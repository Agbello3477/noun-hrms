apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noun-hrms-staging

bases:
  - ../../base

namePrefix: staging-

patchesStrategicMerge:
  - ingress-patch.yaml

configMapGenerator:
  - name: noun-hrms-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - CLIENT_URL=https://hrms-staging.noun.edu.ng
      - PORT=5055
